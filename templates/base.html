<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inclutech</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="container-fluid"> <!--Container que ocupa 100% da largura-->
   <div class="row"> <!-- Cria uma linha do grid do Bootstrap -->

      <!-- Sidebar (barra lateral) -->
      <div class="col-md-2 sidebar d-flex flex-column align-itens-start">
        <div class="logo">
          <!-- Exibe a imagem da logo, responsiva -->
          <img src="{{ url_for('static', filename='imagens/logo-inclutech.png') }}" alt="Logo" class="img-fluid" style="max-width: 100%; height: auto;">
        </div>
        <div class="menu-title">MENU</div> <!-- Titulo da seção de menu -->

        <!-- Links de navegação -->
        <a href="{{ url_for('index') }}" class="mb-2 w-100 text-decoration-none">Página Inicial</a>
        <a href="{{ url_for('cadastra_ong') }}" class="mb-2 w-100 text-decoration-none">Cadastro de Doadores</a>
        <a href="{{ url_for('sobre') }}" class="mb-2 w-100 text-decoration-none">Sobre Nós</a>
        <a href="{{ url_for('ajuda') }}" class="mt-auto w-100 text-decoration-none footer-text">Ajuda e Informações</a>
      </div>
      
      <!-- Área de conteúdo principal -->
      <div class="col-md-10 p-4">
        {% block content %}{% endblock %} <!-- Bloco de conteúdo que será preenchido por outras páginas -->
      </div>
    </div>
  </div>
</body>
</html>
